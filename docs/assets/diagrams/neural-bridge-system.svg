<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="title description">
  <title id="title">Neural Bridge system</title>
  <desc id="description">Raw video passes through frozen V-JEPA 2.1 and TRIBE v2 to produce predicted cortical response. A video-only lane and a separate autoregressive-assisted lane rank future movement and identify peaks, weak moments, and comparisons.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#38566f"/>
    </marker>
    <style>
      .title{font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142738}.lane{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.4px}.label{font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#142738;text-anchor:middle}.small{font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#38566f;text-anchor:middle}.edge{fill:none;stroke:#38566f;stroke-width:2.5;marker-end:url(#arrow)}.shared{fill:#eef6fc;stroke:#397db3;stroke-width:2}.video{fill:#edf8f0;stroke:#39895a;stroke-width:2}.assisted{fill:#fff5e7;stroke:#b36b13;stroke-width:2}.output{fill:#f3effa;stroke:#7551a6;stroke-width:2}
    </style>
  </defs>
  <rect width="720" height="760" rx="18" fill="#fff" stroke="#d4dde5" stroke-width="2"/>
  <text class="title" x="360" y="42" text-anchor="middle">Neural Bridge</text>
  <rect class="shared" x="235" y="66" width="250" height="54" rx="12"/><text class="label" x="360" y="99">Raw video</text><path class="edge" d="M360 120V148"/>
  <rect class="shared" x="215" y="150" width="290" height="58" rx="12"/><text class="label" x="360" y="184">Frozen V-JEPA 2.1</text><path class="edge" d="M360 208V236"/>
  <rect class="shared" x="215" y="238" width="290" height="58" rx="12"/><text class="label" x="360" y="272">Frozen TRIBE v2</text><path class="edge" d="M360 296V324"/>
  <rect class="shared" x="180" y="326" width="360" height="72" rx="12"/><text class="label" x="360" y="357">Predicted average-subject</text><text class="label" x="360" y="379">cortical response</text>
  <text class="lane" x="185" y="432" text-anchor="middle" fill="#267447">VIDEO-ONLY LANE</text><text class="lane" x="535" y="432" text-anchor="middle" fill="#96570c">AR-ASSISTED LANE</text>
  <path class="edge" d="M300 398C300 420 185 420 185 452"/><path class="edge" d="M420 398C660 408 686 548 658 573"/>
  <rect class="video" x="65" y="454" width="240" height="62" rx="12"/><text class="label" x="185" y="491">Video-only bridge</text>
  <rect class="assisted" x="415" y="454" width="240" height="62" rx="12"/><text class="small" x="535" y="480">Recent observed arousal</text><text class="label" x="535" y="501">Frozen target-specific AR</text><path class="edge" d="M535 516V540"/>
  <rect class="assisted" x="415" y="542" width="240" height="62" rx="12"/><text class="label" x="535" y="569">Fold-safe causal</text><text class="label" x="535" y="590">temporal bridge</text>
  <path class="edge" d="M185 516C185 560 275 576 300 610V638"/><path class="edge" d="M535 604C535 620 445 620 420 638"/>
  <rect class="output" x="205" y="640" width="310" height="62" rx="12"/><text class="label" x="360" y="677">Future-movement ranking</text><path class="edge" d="M360 702V712"/>
  <rect class="output" x="150" y="714" width="420" height="32" rx="12"/><text class="small" x="360" y="735">Peaks · weak moments · continuous forecasts · comparisons</text>
</svg>
