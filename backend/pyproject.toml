[project]
name = "neural-bridge-backend"
version = "0.2.0"
description = "Neural Bridge - Offline-first fork running on Neo4j + Ollama"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Neural Bridge Team" }
]

dependencies = [
    # Core web framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # LLM / inference clients (OpenAI-compatible, points at LM Studio or Ollama)
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.28.0",

    # Graph database
    "neo4j>=5.15.0",

    # Multi-agent simulation (OASIS + CAMEL-AI)
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",

    # Quantitative / data processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "openpyxl>=3.1.0",
    "catboost>=1.2.8",
    "scikit-learn>=1.5.0",

    # Neuro / ML runtime
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "tqdm>=4.66.0",
    "nibabel>=5.2.0",
    "nilearn>=0.10.0",
    "mlx>=0.20.0",
    "mlx-lm>=0.19.0",
    "momentfm>=0.1.0",
    "neuralset>=0.1.0",
    "exca>=0.5.0",

    # File parsing
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
