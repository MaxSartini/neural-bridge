[project]
name = "neural-bridge-backend"
version = "0.2.0"
description = "Neural Bridge VEATIC/TRIBE backend and benchmark runtime"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "Neural Bridge Team" }
]

dependencies = [
    # Core web framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # HTTP utility imported by the vendored TRIBE runtime package
    "requests>=2.28.0",

    # Quantitative / data processing
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.5.0",

    # Neuro / ML runtime
    "torch>=2.3.0",
    "transformers>=4.44.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.24.0",
    "tqdm>=4.66.0",
    "nibabel>=5.2.0",
    "nilearn>=0.10.0",
    "mlx>=0.20.0",
    "mlx-lm>=0.19.0",
    "neuralset>=0.1.0",
    "neuraltrain>=0.1.0",
    "exca>=0.5.0",
    "einops>=0.8.0",
    "lightning>=2.3.0",
    "mne>=1.8.0",
    "torchmetrics>=1.4.0",
    "PyYAML>=6.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
